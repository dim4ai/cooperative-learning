# Compression for every co-learn site: nginx.conf turns gzip on but only for text/html.
# Lives in /etc/nginx/conf.d/ (inside the http block). The teacher's app script goes 1.3 MB → ~390 KB.
gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/xml;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
