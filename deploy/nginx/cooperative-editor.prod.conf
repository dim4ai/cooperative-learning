# Прод (212.118.45.47): /etc/nginx/conf.d/cooperative-editor.conf
# Нужен editor.co-learn.ru в общем сертификате co-learn.ru (snippets/cooperative-ssl.conf).
server {
    listen 443 ssl;
    server_name editor.co-learn.ru;
    include snippets/cooperative-ssl.conf;

    root /home/dim4ai/co-learn/editor;
    index index.html;

    # .mjs (pdf.js worker) is not in nginx mime.types — browsers refuse module workers served as octet-stream
    location ~ ^/assets/.+\.mjs$ {
        default_type text/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
