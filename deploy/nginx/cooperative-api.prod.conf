# Прод (212.118.45.47): /etc/nginx/conf.d/cooperative-api.conf
server {
    listen 443 ssl;
    server_name api.co-learn.ru;
    include snippets/cooperative-ssl.conf;

    # lesson material uploads (.lesson.zip with images), see server MAX_UPLOAD_BYTES
    client_max_body_size 16m; # lesson structure (JSON) only, no files

    location / {
        proxy_pass http://127.0.0.1:13113;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # real client IP — the code/login brute-force limits are per IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr; # overwrite, never append: the server trusts the first entry
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
