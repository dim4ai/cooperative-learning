# Прод (212.118.45.47): /etc/nginx/conf.d/cooperative-player.conf
# Нужен player.co-learn.ru в общем сертификате co-learn.ru (snippets/cooperative-ssl.conf).
# Проигрыватель записей уроков: статика, файлы записи читаются в браузере, на сервер ничего не идёт.
server {
    listen 443 ssl;
    server_name player.co-learn.ru;
    include snippets/cooperative-ssl.conf;

    root /home/dim4ai/co-learn/player;
    index index.html;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
