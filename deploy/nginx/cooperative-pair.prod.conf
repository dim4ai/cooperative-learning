# Прод (212.118.45.47): /etc/nginx/conf.d/cooperative-pair.conf
# Нужен pair.co-learn.ru в общем сертификате co-learn.ru (snippets/cooperative-ssl.conf).
server {
    listen 80;
    server_name pair.co-learn.ru;
    return 301 https://pair.co-learn.ru$request_uri;
}

server {
    listen 443 ssl;
    server_name pair.co-learn.ru;
    include snippets/cooperative-ssl.conf;

    root /home/dim4ai/co-learn/pair;
    index index.html;

    # signaling only (pair/server): offers, answers, ICE candidates. Media never comes here.
    location = /ws {
        proxy_pass http://127.0.0.1:13119;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # real client IP — per-IP connection limits in the server
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1h;
    }

    location /assets/ {
        include snippets/cooperative-headers.conf; # add_header here drops the server-level ones
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        include snippets/cooperative-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
