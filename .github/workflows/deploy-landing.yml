name: Deploy landing

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - '.github/workflows/deploy-landing.yml'

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # co-learn.ru/demo/ is the standalone demo, deployed on its own from the demo branch (tags demo-v*): left as it is
      - name: Deploy landing page
        run: rsync -a --delete --exclude /demo/ landing/ ~/co-learn/landing/
