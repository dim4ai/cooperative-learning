name: Deploy

on:
  push:
    branches: [main]
    # the landing page, the editor and pair have their own deploys: changing them mustn't restart the server mid-lesson
    paths-ignore:
      - 'landing/**'
      - '.github/workflows/deploy-landing.yml'
      - 'pair/**'
      - '.github/workflows/deploy-pair.yml'
      - 'client-editor/**'
      - '.github/workflows/deploy-editor.yml'

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Check shared slide player copies are in sync
        run: scripts/sync-slides.sh --check

      - name: Build teacher client
        working-directory: client-teacher
        env:
          VITE_API_URL: https://api.co-learn.ru
        run: |
          npm ci
          npm run build

      - name: Build student client
        working-directory: client-student
        env:
          VITE_API_URL: https://api.co-learn.ru
        run: |
          npm ci
          npm run build

      - name: Build server
        working-directory: server
        run: |
          npm ci
          npm run build

      - name: Deploy static clients
        run: |
          rsync -a --delete client-teacher/dist/ ~/co-learn/teacher/
          rsync -a --delete client-student/dist/ ~/co-learn/student/

      - name: Deploy and restart server
        run: |
          rsync -a --delete server/dist/ ~/co-learn/server/dist/
          cp server/package.json server/package-lock.json ~/co-learn/server/
          cd ~/co-learn/server && npm ci --omit=dev
          pm2 restart co-learn-server || pm2 start dist/index.js --name co-learn-server --cwd ~/co-learn/server
          pm2 save
